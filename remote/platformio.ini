; Handheld remote for the cart: Waveshare ESP32-S3-Touch-LCD-1.69 + Beitian BK-880 GPS.
; Build and flash: see README.md.
[env:remote]
platform = espressif32 @ 6.9.0          ; Arduino core 2.0.17
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
monitor_speed = 115200
build_flags =
  -DARDUINO_USB_MODE=1                 ; USB-C is the S3's own USB: serial and flashing
  -DARDUINO_USB_CDC_ON_BOOT=1          ; Serial = USB, so UART pins 43/44 are free for the GPS
lib_deps =
  moononournation/GFX Library for Arduino @ 1.4.9
  mikalhart/TinyGPSPlus @ 1.1.0
  bblanchon/ArduinoJson @ 7.2.1
